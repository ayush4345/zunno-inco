[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@inco/lightning/=lib/inco-lightning/",
    "forge-std/=lib/forge-std/src/"
]

# NOTE: adjust the @inco/lightning remapping to match how you install the
# Inco Lightning Solidity library (git submodule vs npm). See docs.inco.org.

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base = "${BASE_RPC}"
