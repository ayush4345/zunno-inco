[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@inco/lightning/=lib/inco-lightning/",
    "forge-std/=lib/forge-std/src/"
]

# NOTE: install the Inco Lightning Solidity library and point the
# @inco/lightning remapping at it (git submodule or npm). The ConfidentialDeck
# kit is vendored at src/kit/ConfidentialDeck.sol and imports @inco/lightning.
# See docs.inco.org.

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
base = "${BASE_RPC}"
